name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API and worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check services infra packages
      - run: uv run ruff check services infra packages
      - run: uv run mypy services packages
      - run: uv run pytest
      - name: Verify migration upgrade, rollback, and restore
        run: |
          CODE_GENOME_DATABASE_URL=sqlite:///./migration_check.db uv run alembic upgrade head
          CODE_GENOME_DATABASE_URL=sqlite:///./migration_check.db uv run alembic downgrade base
          CODE_GENOME_DATABASE_URL=sqlite:///./migration_check.db uv run alembic upgrade head
      - run: uv run pip-audit

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
